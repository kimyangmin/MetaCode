name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest

    # 서버 e2e 테스트가 쓰는 DB와 Redis. 포트는 로컬 개발 환경(infra/docker-compose.yml)과 같게 맞춘다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metacode
          POSTGRES_PASSWORD: metacode
          POSTGRES_DB: metacode
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U metacode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 첨부 파일 테스트용 S3 호환 저장소. 서비스 컨테이너는 실행 명령을 지정할 수 없어 직접 띄운다.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 9000:9000 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.47 \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:9000 && break; sleep 1; done

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # main에 push되고 검사를 통과하면 운영 서버에 배포한다. 설정은 docs/deploy.md 9단계.
  # 서버의 authorized_keys가 이 키로는 infra/deploy.sh만 실행하게 묶어 두므로 명령을 따로 보내지 않는다.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # 배포가 겹치면 앞의 것이 끝난 뒤에 이어서 한다 (중간에 끊지 않음).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "ubuntu@$HOST"
