# 데스크톱 설치 파일 설정 (electron-builder). 만들기: pnpm --filter @metacode/desktop dist:win
# 앱 안에는 메인 프로세스와 preload만 들어간다. 화면은 운영 사이트를 연다 (src/main/index.ts).
appId: me.kimyangmin.metacode
productName: MetaCode
# 설치한 앱의 이름. 사용자 데이터(로그인 등)가 %APPDATA%\MetaCode에 따로 생겨서 개발용 앱(@metacode/desktop)과 섞이지 않는다.
extraMetadata:
  productName: MetaCode
directories:
  output: release
files:
  - dist/**/*.js
  - package.json
# 런타임 의존성(electron-updater)은 JS뿐이라 다시 빌드할 네이티브 모듈이 없다.
npmRebuild: false
# 자동 업데이트가 새 버전을 찾는 곳 (앱 안의 app-update.yml에 들어간다). 올리는 것은 GitHub Actions가
# 한다 (.github/workflows/desktop-release.yml). 코드 서명을 하게 되면 win.publisherName을 넣어서
# 받은 설치 파일의 서명을 확인하게 한다.
publish:
  provider: github
  owner: kimyangmin
  repo: MetaCode
# 초대 링크 "앱에서 열기"(metacode://invite/<코드>). 실행할 때도 app.setAsDefaultProtocolClient로 등록한다.
protocols:
  - name: MetaCode
    schemes: [metacode]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # 누르면 바로 현재 사용자 계정에 설치된다 (관리자 권한 필요 없음).
  oneClick: true
  perMachine: false
  artifactName: MetaCode-Setup-${version}.${ext}
