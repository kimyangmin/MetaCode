# 데스크톱 설치 파일 설정 (electron-builder). 만들기: pnpm --filter @metacode/desktop dist:win (dist:mac, dist:linux)
# 앱 안에는 메인 프로세스와 preload만 들어간다. 화면은 운영 사이트를 연다 (src/main/index.ts).
appId: me.kimyangmin.metacode
productName: MetaCode
# 설치한 앱의 이름. 사용자 데이터(로그인 등)가 %APPDATA%\MetaCode에 따로 생겨서 개발용 앱(@metacode/desktop)과 섞이지 않는다.
extraMetadata:
  productName: MetaCode
directories:
  output: release
files:
  - dist/**/*.js
  - package.json
# 런타임 의존성(electron-updater)은 JS뿐이라 다시 빌드할 네이티브 모듈이 없다.
npmRebuild: false
# 자동 업데이트가 새 버전을 찾는 곳 (앱 안의 app-update.yml에 들어간다). 올리는 것은 GitHub Actions가
# 한다 (.github/workflows/desktop-release.yml). 코드 서명을 하게 되면 win.publisherName을 넣어서
# 받은 설치 파일의 서명을 확인하게 한다.
publish:
  provider: github
  owner: kimyangmin
  repo: MetaCode
# 초대 링크 "앱에서 열기"(metacode://invite/<코드>). 실행할 때도 app.setAsDefaultProtocolClient로 등록한다.
protocols:
  - name: MetaCode
    schemes: [metacode]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # 누르면 바로 현재 사용자 계정에 설치된다 (관리자 권한 필요 없음).
  oneClick: true
  perMachine: false
  artifactName: MetaCode-Setup-${version}.${ext}

# macOS: Apple Silicon·Intel 각각 dmg(설치용)와 zip(업데이트 확인용 latest-mac.yml). Apple 개발자 서명을
# 하지 않으므로 임시(ad-hoc) 서명만 한다 (Apple Silicon은 서명이 아예 없으면 실행되지 않음). 서명이 없어
# 자동 업데이트(Squirrel.Mac)는 할 수 없어서, 앱은 새 버전이 있다는 것만 알린다 (src/main/updater.ts).
# 처음 열 때 "확인되지 않은 개발자" 경고가 뜨면 시스템 설정 → 개인정보 보호 및 보안 → "그래도 열기".
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.social-networking
  identity: '-'
  # 서명 없이 hardened runtime을 켜면 JIT 권한(entitlements)이 없어 앱이 뜨지 않는다.
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: MetaCode-${version}-mac-${arch}.${ext}
dmg:
  artifactName: MetaCode-${version}-mac-${arch}.${ext}
# Linux: AppImage(자동 업데이트됨)와 deb(Debian·Ubuntu, 새 버전 알림만).
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network
  synopsis: 채팅과 메타버스를 한 화면에서
  executableName: metacode
  # 실행 중인 창을 metacode.desktop과 묶는다 (작업 표시줄 아이콘).
  syncDesktopName: true
  maintainer: kimyangmin <kimyangmin@users.noreply.github.com>
  artifactName: MetaCode-${version}-linux-${arch}.${ext}
deb:
  packageName: metacode
