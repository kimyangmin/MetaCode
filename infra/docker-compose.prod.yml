# 운영용 구성. 사용법은 docs/deploy.md를 본다.
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build
#
# 외부에는 Caddy의 80/443만 연다. 서버, DB, Redis, 파일 저장소는 내부 네트워크에만 있다.
# 값이 비어 있으면 시작하지 않도록 필수 변수는 ${VAR:?}로 적는다.
name: metacode-prod

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN:?API_DOMAIN을 .env.production에 적어 주세요}
        VITE_WEB_URL: https://${APP_DOMAIN:?APP_DOMAIN을 .env.production에 적어 주세요}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      FILES_DOMAIN: ${FILES_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL을 .env.production에 적어 주세요}
    volumes:
      - caddy-data:/data # 발급받은 인증서. 지우면 다시 발급받는다.
      - caddy-config:/config
    depends_on:
      - server
      - seaweedfs

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      PUBLIC_SERVER_URL: https://${API_DOMAIN:?}
      WEB_ORIGIN: https://${APP_DOMAIN:?}
      DATABASE_URL: postgresql://metacode:${POSTGRES_PASSWORD:?}@postgres:5432/metacode
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
      JWT_SECRET: ${JWT_SECRET:?}
      # 서버는 내부 주소로 파일을 읽고 쓰고, 브라우저에 줄 주소는 공개 도메인으로 서명한다.
      S3_ENDPOINT: http://seaweedfs:9000
      S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN:?}
      S3_BUCKET: metacode-uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-50}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # 첨부 파일 버킷이 만들어진 뒤에 시작한다.
      seaweedfs-init:
        condition: service_completed_successfully

  # 서버보다 먼저 DB 마이그레이션을 적용하고 끝난다.
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://metacode:${POSTGRES_PASSWORD:?}@postgres:5432/metacode
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metacode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: metacode
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metacode']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 호환 파일 저장소. 계정은 환경변수로 받아 시작할 때 설정 파일을 만든다 (저장소에 비밀값을 두지 않음).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{"identities":[{"name":"metacode","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    restart: 'no'
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do sleep 1; done;
      echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 | grep -q metacode-uploads ||
      echo 's3.bucket.create -name metacode-uploads' | weed shell -master=seaweedfs:9333
      "

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  seaweedfs-data:
