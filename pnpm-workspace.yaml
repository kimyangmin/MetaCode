packages:
  - apps/*
  - packages/*

# pnpm 10은 의존성의 설치 스크립트를 기본으로 막는다. 필요한 것만 허용한다.
onlyBuiltDependencies:
  - '@prisma/engines'
  # 미리 빌드된 Skia 네이티브 라이브러리를 받는다 (apps/mobile)
  - '@shopify/react-native-skia'
  - '@swc/core'
  - electron
  - esbuild
  - prisma

# 설치 스크립트가 필요 없어 막아 둔 것 (경고를 끄기 위해 적어 둔다).
#   electron-winstaller: electron-builder의 Squirrel 설치 파일용. 우리는 NSIS를 쓴다.
ignoredBuiltDependencies:
  - electron-winstaller
